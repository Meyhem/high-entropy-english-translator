<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>LoRA formula as a picture</title>
<desc>Input x of 1024 numbers splits into two paths. Top: frozen original weights W produce W·x. Bottom: matrix A squeezes x to 16 numbers, matrix B expands them back to 1024, producing a small correction. The two are added to give output y.</desc>
<style>
  .bg { fill: #ffffff; }
  .t { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .s { fill: #59636e; font-size: 12px; }
  .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
  .leader { stroke: #8c959f; stroke-width: 0.5; stroke-dasharray: 3 3; }
  .gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .green { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  .dot { fill: #9FE1CB; stroke: #0F6E56; stroke-width: 0.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .line { stroke: #9198a1; }
    .gray { fill: #444441; stroke: #B4B2A9; }
    .green { fill: #085041; stroke: #5DCAA5; }
    .dot { fill: #1D9E75; stroke: #9FE1CB; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="450" rx="12"/>
<text class="t" x="340" y="40" text-anchor="middle">y  =  W · x   +   B · (A · x)</text>
<g class="gray"><circle cx="80" cy="150" r="7"/><circle cx="80" cy="176" r="7"/><circle cx="80" cy="202" r="7"/><circle cx="80" cy="228" r="7"/><circle cx="80" cy="254" r="7"/><circle cx="80" cy="280" r="7"/><circle cx="80" cy="306" r="7"/></g>
<text class="t" x="80" y="344" text-anchor="middle">x</text>
<text class="s" x="80" y="362" text-anchor="middle">input, 1024</text>
<path class="line" d="M92 228 H130 V130 H176" marker-end="url(#arrow)"/>
<path class="line" d="M130 228 V290 H176" marker-end="url(#arrow)"/>
<rect class="gray" x="180" y="80" width="260" height="100" rx="8"/>
<text class="t" x="310" y="116" text-anchor="middle">W</text>
<text class="s" x="310" y="140" text-anchor="middle">original weights, frozen</text>
<text class="s" x="310" y="160" text-anchor="middle">1024 × 1024 ≈ 1M numbers</text>
<polygon class="green" points="180,225 280,262 280,318 180,355"/>
<text class="t" x="222" y="285" text-anchor="middle">A</text>
<text class="s" x="222" y="305" text-anchor="middle">squeeze</text>
<g class="dot"><circle cx="310" cy="272" r="4"/><circle cx="310" cy="284" r="4"/><circle cx="310" cy="296" r="4"/><circle cx="310" cy="308" r="4"/></g>
<line class="leader" x1="310" y1="316" x2="310" y2="362"/>
<text class="s" x="310" y="378" text-anchor="middle">16 numbers</text>
<polygon class="green" points="340,262 440,225 440,355 340,318"/>
<text class="t" x="398" y="285" text-anchor="middle">B</text>
<text class="s" x="398" y="305" text-anchor="middle">expand</text>
<path class="line" d="M440 130 H520 V208" marker-end="url(#arrow)"/>
<path class="line" d="M440 290 H520 V248" marker-end="url(#arrow)"/>
<text class="s" x="480" y="120" text-anchor="middle">W·x</text>
<text class="s" x="480" y="308" text-anchor="middle">B·A·x</text>
<circle class="line" cx="520" cy="228" r="16" stroke-width="1"/>
<text class="t" x="520" y="233" text-anchor="middle">+</text>
<path class="line" d="M536 228 H584" marker-end="url(#arrow)"/>
<g class="gray"><circle cx="600" cy="150" r="7"/><circle cx="600" cy="176" r="7"/><circle cx="600" cy="202" r="7"/><circle cx="600" cy="254" r="7"/><circle cx="600" cy="280" r="7"/><circle cx="600" cy="306" r="7"/></g>
<text class="t" x="600" y="344" text-anchor="middle">y</text>
<text class="s" x="600" y="362" text-anchor="middle">output, 1024</text>
<text class="s" x="340" y="410" text-anchor="middle">Gray: original layer, never changes. Green: LoRA bypass, the only part that trains.</text>
<text class="s" x="340" y="430" text-anchor="middle">A ≈ 16K numbers, B ≈ 16K numbers, vs W ≈ 1M</text>
</svg>
